faq:
  eyebrow: 常見問題
  heading: 常見問題
  items:
    - q: PrizmX 免費嗎？
      a: >-
        是的。PrizmX Mac 社群版免費且開源，採用 [Apache License 2.0](https://github.com/PrizmX/PrizmX/blob/main/LICENSE) 授權。
    - q: 執行需要什麼條件？
      a: >-
        一台執行 macOS %min% 或以上版本的 Mac。從 [GitHub Releases](https://github.com/PrizmX/PrizmX/releases/latest) 下載經簽署並通過公證的 DMG，將 PrizmX 拖進「應用程式」即可。
    - q: 如何啟用通道？
      a: >-
        首次開啟 TUN 時，macOS 會詢問是否允許 PrizmX Tunnel 系統延伸功能。前往**系統設定 → 一般 → 登入項目與延伸功能 → 網路延伸功能**，並開啟 **PrizmX Tunnel**。
    - q: 可以使用現有的 Clash 訂閱嗎？
      a: >-
        可以。PrizmX 可從本機檔案或訂閱連結讀取 Clash YAML 與 sing-box JSON。使用尚未支援協定的節點會被略過，規則、策略群組與其餘節點照常載入。
    - q: TUN 和系統代理有什麼差別？
      a: >-
        系統代理透過混合連接埠（預設 7890，支援 HTTP CONNECT 與 SOCKS5）服務遵循 macOS 代理設定的 App；TUN 則透過 Packet Tunnel 搭配 FakeIP DNS 接管所有流量，包括不遵循代理設定的 App。兩者可擇一或同時使用。
    - q: PrizmX 支援 VMess、Hysteria 或 WireGuard 嗎？
      a: >-
        尚未支援。目前 PrizmX 支援 Shadowsocks、VLESS（TLS、REALITY、Vision）、Trojan 與 AnyTLS。開發進度可追蹤 [PrizmX-Foundation](https://github.com/PrizmX/PrizmX-Foundation)。
    - q: PrizmX 會解密 HTTPS 流量嗎？
      a: >-
        不會。社群版只顯示連線的中繼資料——App、主機、策略、協定與位元組數——絕不會解密或改寫流量。HTTP 擷取、解密與改寫已規劃在 App Store 版提供。
    - q: 有 iPhone 版嗎？
      a: >-
        iPhone 版正作為 App Store 版本的一部分開發中，並與 Mac 版共用同一套核心。可追蹤 [GitHub 上的 PrizmX 組織](https://github.com/PrizmX)取得最新消息。

