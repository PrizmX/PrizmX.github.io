features:
  eyebrow: 功能
  heading: 所需功能，一鍵即達
  intro: >-
    PrizmX 平時待在選單列，方便日常使用；想深入查看策略、規則與流量時，再開啟完整的控制台。
  items:
    - icon: menubar
      title: 選單列優先
      text: >-
        連線、在 Rule / Global / Direct 之間切換、開關系統代理、選擇節點、查看即時速度，全都不必開啟視窗。
    - icon: profile
      title: 相容 Clash 與 sing-box
      text: >-
        從本機檔案或訂閱連結匯入 Clash YAML 或 sing-box JSON，並可直接在 App 內更新訂閱。
    - icon: tunnel
      title: TUN 與系統代理
      text: >-
        透過 Packet Tunnel 系統延伸功能中的 FakeIP TUN 接管所有 App，或使用 HTTP + SOCKS5 混合連接埠的系統代理；開啟 Allow LAN 即可分享給區域網路中的其他裝置。
    - icon: route
      title: 規則分流
      text: >-
        規則將每條連線交給對應的策略；select、url-test、fallback、load-balance 策略群組負責挑選節點、控制延遲。
    - icon: inspect
      title: Inspector
      text: >-
        瀏覽最近與進行中的連線：發起連線的 App、符合的策略、協定、持續時間，以及上傳與下載的位元組數。
    - icon: chart
      title: 流量與延遲
      text: >-
        按日、按月統計流量與用量排行；路徑延遲拆分為網際網路、DNS 與代理三段，迅速找出慢在哪裡。

native:
  eyebrow: 技術底層
  heading: 從介面到封包，全部原生
  intro: >-
    沒有 Electron 外殼，也不內嵌第三方核心。協定、規則、引擎和 TCP/IP 協定堆疊全以 Swift 撰寫，並在 Apple 各平台間共用。
  points:
    - title: 全面採用 Swift 6
      text: >-
        介面採用 SwiftUI，底層啟用嚴格並行檢查。同一套程式碼現在驅動 Mac App，接下來驅動 iOS App。
    - title: SwiftTCP 使用者空間協定堆疊
      text: >-
        專為 Network Extension 打造的 TCP/IP 協定堆疊：零複製封包路徑、CUBIC 或 BBR 壅塞控制，以及每條連線各自獨立的無鎖事件迴圈。
    - title: 沙盒執行，通過公證
      text: >-
        沙盒化的主 App 加上 Packet Tunnel 系統延伸功能，由 CI 直接產出經簽署並通過 Apple 公證的 DMG。
    - title: Open Core，Apache 2.0
      text: >-
        App、協定引擎和網路協定堆疊都在 GitHub 公開。歡迎閱讀、自行建置，或參與貢獻。
  repos_label: 原始碼儲存庫

protocols:
  eyebrow: 協定
  heading: 直接使用<wbr>你現有的伺服器
  intro: >-
    Clash YAML 與 sing-box JSON 均可匯入以下連出協定。VLESS 是協定封裝，TLS 與 REALITY 是傳輸層，Vision 是 VLESS 的 flow，三者可自由組合。
  caption: 支援的連出協定
  columns:
    protocol: 協定
    details: 傳輸與選項
    tcp: TCP
    udp: UDP
  supported: 支援
  unsupported: 不支援
  rows:
    - name: Shadowsocks
      details: "AEAD 加密演算法 `aes-128-gcm` 與 `aes-256-gcm`，原生 TCP 與 UDP"
      tcp: true
      udp: true
    - name: VLESS
      details: "TCP、TLS 或 REALITY · `xtls-rprx-vision` flow · UDP over stream"
      tcp: true
      udp: true
    - name: Trojan
      details: TLS，支援 SNI
      tcp: true
      udp: false
    - name: AnyTLS
      details: TLS 1.3，支援 SNI 與閒置工作階段池
      tcp: true
      udp: false
    - name: Direct
      details: 符合的流量直接連線，不經過代理
      tcp: true
      udp: true
  not_yet: >-
    尚未支援：VMess、Hysteria、TUIC、WireGuard、Shadowsocks 2022、WebSocket / gRPC 傳輸以及 Mux。這些類型的節點會被略過，設定檔中的其餘內容照常載入。

