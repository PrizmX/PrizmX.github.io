faq:
  eyebrow: FAQ
  heading: Questions fréquentes
  items:
    - q: PrizmX est-il gratuit ?
      a: >-
        Oui. PrizmX Communauté pour Mac est gratuit et open source, distribué
        sous [Apache License 2.0](https://github.com/PrizmX/PrizmX/blob/main/LICENSE).
    - q: De quoi ai-je besoin pour l’utiliser ?
      a: >-
        D’un Mac équipé de macOS %min% ou version ultérieure. Téléchargez le DMG
        signé et notarisé depuis
        [GitHub Releases](https://github.com/PrizmX/PrizmX/releases/latest),
        puis faites glisser PrizmX dans le dossier Applications.
    - q: Comment activer le tunnel ?
      a: >-
        La première fois que vous activez TUN, macOS vous demande d’autoriser
        l’extension système PrizmX Tunnel. Ouvrez **Réglages Système → Général →
        Ouverture et extensions → Extensions réseau** et activez
        **PrizmX Tunnel**.
    - q: Puis-je utiliser mon abonnement Clash existant ?
      a: >-
        Oui. PrizmX lit les profils Clash YAML et sing-box JSON depuis un
        fichier local ou une URL d’abonnement. Les nœuds utilisant des
        protocoles non pris en charge sont ignorés ; les règles, les groupes de
        politiques et les autres nœuds se chargent normalement.
    - q: Quelle est la différence entre TUN et le proxy système ?
      a: >-
        Le proxy système dessert les apps qui respectent les réglages proxy de
        macOS, via un port mixte (7890 par défaut) qui gère HTTP CONNECT et
        SOCKS5. TUN fait passer tout le trafic — y compris celui des apps qui
        ignorent les réglages proxy — par un Packet Tunnel avec DNS FakeIP.
        Utilisez l’un, l’autre ou les deux.
    - q: PrizmX prend-il en charge VMess, Hysteria ou WireGuard ?
      a: >-
        Pas encore. PrizmX prend actuellement en charge Shadowsocks, VLESS (TLS,
        REALITY, Vision), Trojan et AnyTLS. Suivez l’avancement sur
        [PrizmX-Foundation](https://github.com/PrizmX/PrizmX-Foundation).
    - q: PrizmX déchiffre-t-il le trafic HTTPS ?
      a: >-
        Non. L’édition Communauté affiche les métadonnées des connexions — app,
        hôte, politique, protocole et octets — mais ne déchiffre ni ne réécrit
        jamais le trafic. La capture, le déchiffrement et la réécriture HTTP
        sont prévus pour l’édition App Store.
    - q: Existe-t-il une version iPhone ?
      a: >-
        Elle est en cours de développement dans le cadre de l’édition App Store
        et partage le même cœur que l’app Mac. Suivez
        [l’organisation PrizmX sur GitHub](https://github.com/PrizmX) pour
        connaître les nouveautés.

