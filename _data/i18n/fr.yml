features:
  eyebrow: Fonctionnalités
  heading: Tout ce qu’il vous faut, en un clic
  intro: >-
    Au quotidien, PrizmX se loge dans la barre des menus, et ouvre une console
    complète lorsque vous voulez examiner en détail les politiques, les règles
    et le trafic.
  items:
    - icon: menubar
      title: Priorité à la barre des menus
      text: >-
        Connectez-vous, basculez entre Rule, Global et Direct, activez ou
        désactivez le proxy système, choisissez un nœud et suivez le débit en
        temps réel sans ouvrir de fenêtre.
    - icon: profile
      title: Profils Clash et sing-box
      text: >-
        Importez des profils Clash YAML ou sing-box JSON depuis un fichier ou
        une URL d’abonnement, et gardez vos abonnements à jour directement dans
        l’app.
    - icon: tunnel
      title: TUN et proxy système
      text: >-
        Capturez le trafic de toutes les apps avec un TUN FakeIP dans une
        extension système Packet Tunnel, ou utilisez le proxy système sur un
        port mixte HTTP + SOCKS5. Activez Allow LAN pour le partager avec
        d’autres appareils.
    - icon: route
      title: Routage par règles
      text: >-
        Les règles dirigent chaque connexion vers une politique. Les groupes de
        politiques — select, url-test, fallback et load-balance — choisissent le
        nœud et maîtrisent la latence.
    - icon: inspect
      title: Inspector
      text: >-
        Parcourez les connexions récentes et actives, avec l’app qui les a
        ouvertes, la politique correspondante, le protocole, la durée et les
        octets dans chaque sens.
    - icon: chart
      title: Trafic et latence
      text: >-
        Totaux quotidiens et mensuels, principaux consommateurs, et latence du
        trajet décomposée en Internet, DNS et proxy pour identifier l’origine
        des ralentissements.

native:
  eyebrow: Sous le capot
  heading: Conçu en natif, jusqu’au paquet
  intro: >-
    Pas d’enveloppe Electron, pas de cœur tiers embarqué. Les protocoles, les
    règles, le moteur et la pile TCP/IP sont écrits en Swift et partagés entre
    les plateformes Apple.
  points:
    - title: Swift 6 de bout en bout
      text: >-
        SwiftUI en surface, concurrence stricte en profondeur. Une seule base de
        code fait tourner l’app Mac aujourd’hui, puis l’app iOS.
    - title: Pile SwiftTCP en espace utilisateur
      text: >-
        Une pile TCP/IP conçue sur mesure pour Network Extension, avec un chemin
        de paquets sans copie, un contrôle de congestion CUBIC ou BBR et des
        boucles d’événements sans verrou par flux.
    - title: Sandbox et notarisation
      text: >-
        Une app hôte en sandbox associée à une extension système Packet Tunnel,
        livrée directement depuis la CI sous forme de DMG signé et notarisé par
        Apple.
    - title: Cœur open source, Apache 2.0
      text: >-
        L’app, le moteur de protocoles et la pile réseau sont publics sur
        GitHub. Lisez le code, compilez-le ou contribuez.
  repos_label: Dépôts de code source

protocols:
  eyebrow: Protocoles
  heading: Compatible avec les serveurs que vous utilisez déjà
  intro: >-
    Les protocoles sortants ci-dessous s’importent aussi bien depuis Clash YAML
    que depuis sing-box JSON. VLESS fournit le format de trame ; TLS et REALITY
    sont des transports ; Vision est un flow VLESS — ils se combinent librement.
  caption: Protocoles sortants pris en charge
  columns:
    protocol: Protocole
    details: Transports et options
    tcp: TCP
    udp: UDP
  supported: "Oui"
  unsupported: "Non"
  rows:
    - name: Shadowsocks
      details: "Chiffrements AEAD `aes-128-gcm` et `aes-256-gcm`, TCP et UDP natifs"
      tcp: true
      udp: true
    - name: VLESS
      details: "TCP, TLS ou REALITY · flow `xtls-rprx-vision` · UDP over stream"
      tcp: true
      udp: true
    - name: Trojan
      details: TLS avec SNI
      tcp: true
      udp: false
    - name: AnyTLS
      details: TLS 1.3 avec SNI et un pool de sessions inactives
      tcp: true
      udp: false
    - name: Direct
      details: Contourne le proxy pour le trafic correspondant
      tcp: true
      udp: true
  not_yet: >-
    Pas encore pris en charge : VMess, Hysteria, TUIC, WireGuard, Shadowsocks
    2022, les transports WebSocket / gRPC et Mux. Les nœuds de ces types sont
    ignorés et le reste de votre profil se charge normalement.

