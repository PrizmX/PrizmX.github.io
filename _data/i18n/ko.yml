faq:
  eyebrow: FAQ
  heading: 자주 묻는 질문
  items:
    - q: PrizmX는 무료인가요?
      a: >-
        네. Mac용 PrizmX 커뮤니티 에디션은 [Apache License 2.0](https://github.com/PrizmX/PrizmX/blob/main/LICENSE)에 따라 배포되는 무료 오픈 소스 소프트웨어입니다.
    - q: 실행하려면 무엇이 필요한가요?
      a: >-
        macOS %min% 이상을 실행하는 Mac이 필요합니다. [GitHub Releases](https://github.com/PrizmX/PrizmX/releases/latest)에서 서명 및 공증된 DMG를 다운로드한 다음, PrizmX를 응용 프로그램 폴더로 드래그하세요.
    - q: 터널은 어떻게 활성화하나요?
      a: >-
        TUN을 처음 켜면 macOS에서 PrizmX Tunnel 시스템 확장 프로그램을 허용할지 묻습니다. **시스템 설정 → 일반 → 로그인 항목 및 확장 프로그램 → 네트워크 확장 프로그램**을 열고 **PrizmX Tunnel**을 켜세요.
    - q: 기존 Clash 구독을 사용할 수 있나요?
      a: >-
        네. PrizmX는 로컬 파일이나 구독 URL에서 Clash YAML과 sing-box JSON을 읽어 옵니다. 지원하지 않는 프로토콜의 노드는 건너뛰며, 규칙, 정책 그룹, 나머지 노드는 평소처럼 로드됩니다.
    - q: TUN과 시스템 프록시의 차이점은 무엇인가요?
      a: >-
        시스템 프록시는 HTTP CONNECT와 SOCKS5를 처리하는 혼합 포트(기본값 7890)를 통해 macOS 프록시 설정을 따르는 앱에 서비스를 제공합니다. TUN은 프록시 설정을 무시하는 앱을 포함한 모든 트래픽을 FakeIP DNS를 사용하는 Packet Tunnel로 라우팅합니다. 둘 중 하나만 사용하거나 둘 다 사용할 수 있습니다.
    - q: PrizmX는 VMess, Hysteria 또는 WireGuard를 지원하나요?
      a: >-
        아직 지원하지 않습니다. 현재 PrizmX는 Shadowsocks, VLESS(TLS, REALITY, Vision), Trojan, AnyTLS를 지원합니다. 진행 상황은 [PrizmX-Foundation](https://github.com/PrizmX/PrizmX-Foundation)에서 확인하세요.
    - q: PrizmX는 HTTPS 트래픽을 복호화하나요?
      a: >-
        아니요. 커뮤니티 에디션은 연결 메타데이터(앱, 호스트, 정책, 프로토콜, 바이트 수)를 보여 줄 뿐, 트래픽을 절대 복호화하거나 재작성하지 않습니다. HTTP 캡처, 복호화 및 재작성은 App Store 에디션에서 제공될 예정입니다.
    - q: iPhone 버전이 있나요?
      a: >-
        App Store 에디션의 일부로 개발 중이며, Mac 앱과 동일한 코어를 공유합니다. 최신 소식은 [GitHub의 PrizmX 조직](https://github.com/PrizmX)에서 확인하세요.

