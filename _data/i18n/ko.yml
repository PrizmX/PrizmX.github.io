features:
  eyebrow: 기능
  heading: 필요한 모든 것을 클릭 한 번으로
  intro: >-
    PrizmX는 평소에는 메뉴 막대에서 사용하고, 정책, 규칙, 트래픽을 자세히 살펴보고 싶을 때는 전체 콘솔을 열 수 있습니다.
  items:
    - icon: menubar
      title: 메뉴 막대 중심
      text: >-
        창을 열지 않고도 연결, Rule / Global / Direct 전환, 시스템 프록시 켜기 및 끄기, 노드 선택, 실시간 속도 확인을 모두 할 수 있습니다.
    - icon: profile
      title: Clash 및 sing-box 프로필
      text: >-
        파일이나 구독 URL에서 Clash YAML 또는 sing-box JSON을 가져오고, 앱 안에서 구독을 최신 상태로 유지할 수 있습니다.
    - icon: tunnel
      title: TUN 및 시스템 프록시
      text: >-
        Packet Tunnel 시스템 확장 프로그램의 FakeIP TUN으로 모든 앱의 트래픽을 캡처하거나, HTTP + SOCKS5 혼합 포트의 시스템 프록시를 사용하세요. Allow LAN을 켜면 다른 기기와 공유할 수 있습니다.
    - icon: route
      title: 규칙 기반 라우팅
      text: >-
        규칙에 따라 각 연결이 정책으로 전달됩니다. select, url-test, fallback, load-balance 정책 그룹이 노드를 선택하고 지연 시간을 관리합니다.
    - icon: inspect
      title: Inspector
      text: >-
        최근 연결과 활성 연결을 살펴보고, 연결을 시작한 앱, 일치한 정책, 프로토콜, 지속 시간, 방향별 전송 바이트를 확인할 수 있습니다.
    - icon: chart
      title: 트래픽 및 지연 시간
      text: >-
        일별·월별 합계와 사용량 상위 항목을 보여 주며, 경로 지연 시간을 인터넷, DNS, 프록시 구간으로 나눠 어디에서 느려지는지 알 수 있습니다.

native:
  eyebrow: 내부 구조
  heading: 패킷 단위까지 네이티브로 구현
  intro: >-
    Electron 셸도, 내장된 서드파티 코어도 없습니다. 프로토콜, 규칙, 엔진, TCP/IP 스택 모두 Swift로 작성되었으며 Apple 플랫폼 전반에서 공유됩니다.
  points:
    - title: 처음부터 끝까지 Swift 6
      text: >-
        UI는 SwiftUI로, 내부는 엄격한 동시성 모델로 작성되었습니다. 하나의 코드베이스로 지금은 Mac 앱을, 다음에는 iOS 앱을 구동합니다.
    - title: SwiftTCP 사용자 공간 스택
      text: >-
        Network Extension을 위해 설계된 전용 TCP/IP 스택으로, 제로 카피 패킷 경로, CUBIC 또는 BBR 혼잡 제어, 플로우별 lock-free 이벤트 루프를 갖추고 있습니다.
    - title: 샌드박스 적용 및 공증 완료
      text: >-
        샌드박스가 적용된 호스트 앱과 Packet Tunnel 시스템 확장 프로그램으로 구성되며, CI에서 바로 서명되고 Apple의 공증을 받은 DMG로 배포됩니다.
    - title: 오픈 코어, Apache 2.0
      text: >-
        앱, 프로토콜 엔진, 네트워크 스택이 GitHub에 공개되어 있습니다. 코드를 읽어 보고, 직접 빌드하거나, 기여해 보세요.
  repos_label: 소스 저장소

protocols:
  eyebrow: 프로토콜
  heading: 이미 사용 중인 서버와 호환
  intro: >-
    Clash YAML과 sing-box JSON 모두 아래 아웃바운드를 가져올 수 있습니다. VLESS는 프레이밍 방식, TLS와 REALITY는 전송 방식, Vision은 VLESS의 flow이며, 서로 자유롭게 조합할 수 있습니다.
  caption: 지원되는 아웃바운드 프로토콜
  columns:
    protocol: 프로토콜
    details: 전송 방식 및 옵션
    tcp: TCP
    udp: UDP
  supported: 지원
  unsupported: 미지원
  rows:
    - name: Shadowsocks
      details: "AEAD 암호 `aes-128-gcm` 및 `aes-256-gcm`, 네이티브 TCP 및 UDP"
      tcp: true
      udp: true
    - name: VLESS
      details: "TCP, TLS 또는 REALITY · `xtls-rprx-vision` flow · UDP over stream"
      tcp: true
      udp: true
    - name: Trojan
      details: SNI를 지원하는 TLS
      tcp: true
      udp: false
    - name: AnyTLS
      details: SNI 및 유휴 세션 풀을 지원하는 TLS 1.3
      tcp: true
      udp: false
    - name: Direct
      details: 일치하는 트래픽은 프록시를 우회
      tcp: true
      udp: true
  not_yet: >-
    아직 지원하지 않는 항목: VMess, Hysteria, TUIC, WireGuard, Shadowsocks 2022, WebSocket / gRPC 전송 방식, Mux. 이러한 유형의 노드는 건너뛰며, 프로필의 나머지 부분은 정상적으로 로드됩니다.

