faq:
  eyebrow: FAQ
  heading: Preguntas frecuentes
  items:
    - q: "¿PrizmX es gratuito?"
      a: >-
        Sí. PrizmX Community para Mac es gratuito y de código abierto, con
        licencia [Apache License 2.0](https://github.com/PrizmX/PrizmX/blob/main/LICENSE).
    - q: "¿Qué necesito para usarlo?"
      a: >-
        Un Mac con macOS %min% o posterior. Descarga el DMG firmado y notarizado
        desde [GitHub Releases](https://github.com/PrizmX/PrizmX/releases/latest)
        y arrastra PrizmX a la carpeta Aplicaciones.
    - q: "¿Cómo activo el túnel?"
      a: >-
        La primera vez que activas TUN, macOS te pide permitir la extensión del
        sistema PrizmX Tunnel. Abre **Ajustes del Sistema → General → Ítems de
        inicio y extensiones → Extensiones de red** y activa **PrizmX Tunnel**.
    - q: "¿Puedo usar mi suscripción de Clash actual?"
      a: >-
        Sí. PrizmX lee YAML de Clash y JSON de sing-box desde un archivo local o
        una URL de suscripción. Los nodos con protocolos no compatibles se
        omiten; las reglas, los grupos de políticas y el resto de los nodos se
        cargan con normalidad.
    - q: "¿Qué diferencia hay entre TUN y el proxy del sistema?"
      a: >-
        El proxy del sistema da servicio a las apps que respetan los ajustes de
        proxy de macOS mediante un puerto mixto (7890 de forma predeterminada)
        que admite HTTP CONNECT y SOCKS5. TUN enruta todo el tráfico —incluidas
        las apps que ignoran los ajustes de proxy— a través de un Packet Tunnel
        con DNS FakeIP. Usa uno de los dos o ambos.
    - q: "¿PrizmX es compatible con VMess, Hysteria o WireGuard?"
      a: >-
        Todavía no. Actualmente PrizmX admite Shadowsocks, VLESS (TLS, REALITY,
        Vision), Trojan y AnyTLS. Sigue el progreso en
        [PrizmX-Foundation](https://github.com/PrizmX/PrizmX-Foundation).
    - q: "¿PrizmX descifra el tráfico HTTPS?"
      a: >-
        No. La edición Community muestra los metadatos de cada conexión (app,
        host, política, protocolo y bytes), pero nunca descifra ni reescribe el
        tráfico. La captura, el descifrado y la reescritura HTTP están previstos
        para la edición de App Store.
    - q: "¿Hay una versión para iPhone?"
      a: >-
        Está en desarrollo como parte de la edición de App Store y comparte el
        mismo núcleo que la app para Mac. Sigue a la
        [organización PrizmX en GitHub](https://github.com/PrizmX) para estar al
        tanto de las novedades.

