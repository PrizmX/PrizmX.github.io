features:
  eyebrow: Funciones
  heading: Todo lo que necesitas, a un clic
  intro: >-
    PrizmX vive en la barra de menús para el uso diario y abre una consola
    completa cuando quieres profundizar en políticas, reglas y tráfico.
  items:
    - icon: menubar
      title: La barra de menús, primero
      text: >-
        Conéctate, cambia entre Rule, Global y Direct, activa o desactiva el
        proxy del sistema, elige un nodo y sigue la velocidad en tiempo real sin
        abrir ninguna ventana.
    - icon: profile
      title: Perfiles de Clash y sing-box
      text: >-
        Importa YAML de Clash o JSON de sing-box desde un archivo o una URL de
        suscripción, y mantén las suscripciones al día desde la propia app.
    - icon: tunnel
      title: TUN y proxy del sistema
      text: >-
        Captura todas las apps con un TUN FakeIP en una extensión del sistema
        Packet Tunnel, o usa el proxy del sistema en un puerto mixto HTTP +
        SOCKS5. Activa Allow LAN para compartirlo con otros dispositivos.
    - icon: route
      title: Enrutamiento por reglas
      text: >-
        Las reglas envían cada conexión a una política. Los grupos de políticas
        —select, url-test, fallback y load-balance— eligen el nodo y mantienen
        la latencia bajo control.
    - icon: inspect
      title: Inspector
      text: >-
        Explora las conexiones recientes y activas con la app que las abrió, la
        política coincidente, el protocolo, la duración y los bytes en cada
        sentido.
    - icon: chart
      title: Tráfico y latencia
      text: >-
        Totales diarios y mensuales, los principales consumidores y la latencia
        de la ruta desglosada en internet, DNS y proxy, para que sepas de dónde
        viene la lentitud.

native:
  eyebrow: Por dentro
  heading: Nativo hasta el último paquete
  intro: >-
    Sin envoltorio de Electron ni núcleo de terceros integrado. Los protocolos,
    las reglas, el motor y la pila TCP/IP están escritos en Swift y se comparten
    entre las plataformas de Apple.
  points:
    - title: Swift 6 de principio a fin
      text: >-
        SwiftUI en la superficie, concurrencia estricta por debajo. Una sola
        base de código impulsa hoy la app para Mac y, a continuación, la de iOS.
    - title: Pila SwiftTCP en espacio de usuario
      text: >-
        Una pila TCP/IP diseñada específicamente para Network Extension, con una
        ruta de paquetes sin copias, control de congestión CUBIC o BBR y bucles
        de eventos por flujo sin bloqueos.
    - title: En sandbox y notarizado
      text: >-
        Una app principal en sandbox y una extensión del sistema Packet Tunnel,
        distribuidas como un DMG firmado y notarizado por Apple directamente
        desde CI.
    - title: Núcleo abierto, Apache 2.0
      text: >-
        La app, el motor de protocolos y la pila de red son públicos en GitHub.
        Lee el código, compílalo o contribuye.
  repos_label: Repositorios de código fuente

protocols:
  eyebrow: Protocolos
  heading: Compatible con los servidores que ya usas
  intro: >-
    Tanto el YAML de Clash como el JSON de sing-box importan las salidas
    siguientes. VLESS es el encapsulado; TLS y REALITY son transportes; Vision
    es un flow de VLESS, y se pueden combinar libremente.
  caption: Protocolos de salida compatibles
  columns:
    protocol: Protocolo
    details: Transportes y opciones
    tcp: TCP
    udp: UDP
  supported: "Sí"
  unsupported: "No"
  rows:
    - name: Shadowsocks
      details: "Cifrados AEAD `aes-128-gcm` y `aes-256-gcm`, TCP y UDP nativos"
      tcp: true
      udp: true
    - name: VLESS
      details: "TCP, TLS o REALITY · flow `xtls-rprx-vision` · UDP sobre stream"
      tcp: true
      udp: true
    - name: Trojan
      details: TLS con SNI
      tcp: true
      udp: false
    - name: AnyTLS
      details: TLS 1.3 con SNI y un pool de sesiones inactivas
      tcp: true
      udp: false
    - name: Direct
      details: Evita el proxy para el tráfico coincidente
      tcp: true
      udp: true
  not_yet: >-
    Aún no se admiten: VMess, Hysteria, TUIC, WireGuard, Shadowsocks 2022, los
    transportes WebSocket / gRPC ni Mux. Los nodos de estos tipos se omiten y el
    resto de tu perfil se carga igualmente.

