faq:
  eyebrow: FAQ
  heading: Frequently asked questions
  items:
    - q: Is PrizmX free?
      a: >-
        Yes. PrizmX Community for Mac is free and open source under the
        [Apache License 2.0](https://github.com/PrizmX/PrizmX/blob/main/LICENSE).
    - q: What do I need to run it?
      a: >-
        A Mac running macOS %min% or later. Download the signed and notarized
        DMG from [GitHub Releases](https://github.com/PrizmX/PrizmX/releases/latest)
        and drag PrizmX into Applications.
    - q: How do I enable the tunnel?
      a: >-
        The first time you turn on TUN, macOS asks to allow the PrizmX Tunnel
        system extension. Open **System Settings → General → Login Items &
        Extensions → Network Extensions** and switch on **PrizmX Tunnel**.
    - q: Can I use my existing Clash subscription?
      a: >-
        Yes. PrizmX reads Clash YAML and sing-box JSON from a local file or a
        subscription URL. Nodes with unsupported protocols are skipped; rules,
        policy groups and the remaining nodes load as usual.
    - q: What is the difference between TUN and System Proxy?
      a: >-
        System Proxy serves apps that honor macOS proxy settings through a
        mixed port (7890 by default) that speaks HTTP CONNECT and SOCKS5. TUN
        routes all traffic — including apps that ignore proxy settings —
        through a Packet Tunnel with FakeIP DNS. Use either one or both.
    - q: Does PrizmX support VMess, Hysteria or WireGuard?
      a: >-
        Not yet. Today PrizmX supports Shadowsocks, VLESS (TLS, REALITY,
        Vision), Trojan and AnyTLS. Track progress in
        [PrizmX-Foundation](https://github.com/PrizmX/PrizmX-Foundation).
    - q: Does PrizmX decrypt HTTPS traffic?
      a: >-
        No. The Community Edition shows connection metadata — app, host,
        policy, protocol and bytes — but never decrypts or rewrites traffic.
        HTTP capture, decrypt and rewrite are planned for the App Store edition.
    - q: Is there an iPhone version?
      a: >-
        It is in development as part of the App Store edition and shares the
        same core as the Mac app. Watch the
        [PrizmX organization on GitHub](https://github.com/PrizmX) for updates.

