features:
  eyebrow: Features
  heading: Everything you need, one click away
  intro: >-
    PrizmX lives in the menu bar for daily use and opens a full console when
    you want to dig into policies, rules and traffic.
  items:
    - icon: menubar
      title: Menu bar first
      text: >-
        Connect, switch between Rule, Global and Direct, toggle System Proxy,
        pick a node and watch live speed without opening a window.
    - icon: profile
      title: Clash & sing-box profiles
      text: >-
        Import Clash YAML or sing-box JSON from a file or a subscription URL,
        and keep subscriptions fresh from inside the app.
    - icon: tunnel
      title: TUN and System Proxy
      text: >-
        Capture every app with a FakeIP TUN in a Packet Tunnel system
        extension, or use System Proxy on a mixed HTTP + SOCKS5 port. Allow LAN
        to share it with other devices.
    - icon: route
      title: Rule-based routing
      text: >-
        Rules send each connection to a policy. Policy groups — select,
        url-test, fallback and load-balance — pick the node and keep latency
        in check.
    - icon: inspect
      title: Inspector
      text: >-
        Browse recent and active connections with the app that opened them,
        the matched policy, protocol, duration and bytes in each direction.
    - icon: chart
      title: Traffic & latency
      text: >-
        Daily and monthly totals, top consumers, and path latency split into
        internet, DNS and proxy so you can tell where slowness comes from.

native:
  eyebrow: Under the hood
  heading: Built natively, down to the packet
  intro: >-
    No Electron shell and no embedded third-party core. Protocols, rules, the
    engine and the TCP/IP stack are written in Swift and shared across Apple
    platforms.
  points:
    - title: Swift 6 from end to end
      text: >-
        SwiftUI on the surface, strict concurrency underneath. One codebase
        powers the Mac app today and the iOS app next.
    - title: SwiftTCP userspace stack
      text: >-
        A purpose-built TCP/IP stack for Network Extension with a zero-copy
        packet path, CUBIC or BBR congestion control and lock-free per-flow
        event loops.
    - title: Sandboxed and notarized
      text: >-
        A sandboxed host app plus a Packet Tunnel system extension, shipped as
        a signed and Apple-notarized DMG straight from CI.
    - title: Open core, Apache 2.0
      text: >-
        The app, the protocol engine and the network stack are public on
        GitHub. Read it, build it, or contribute.
  repos_label: Source repositories

protocols:
  eyebrow: Protocols
  heading: Works with the servers you already use
  intro: >-
    Clash YAML and sing-box JSON both import the outbounds below. VLESS is the
    framing; TLS and REALITY are transports; Vision is a VLESS flow — they
    combine freely.
  caption: Supported outbound protocols
  columns:
    protocol: Protocol
    details: Transports & options
    tcp: TCP
    udp: UDP
  supported: "Yes"
  unsupported: "No"
  rows:
    - name: Shadowsocks
      details: "AEAD ciphers `aes-128-gcm` and `aes-256-gcm`, native TCP and UDP"
      tcp: true
      udp: true
    - name: VLESS
      details: "TCP, TLS or REALITY · `xtls-rprx-vision` flow · UDP over stream"
      tcp: true
      udp: true
    - name: Trojan
      details: TLS with SNI
      tcp: true
      udp: false
    - name: AnyTLS
      details: TLS 1.3 with SNI and an idle session pool
      tcp: true
      udp: false
    - name: Direct
      details: Bypass the proxy for matched traffic
      tcp: true
      udp: true
  not_yet: >-
    Not supported yet: VMess, Hysteria, TUIC, WireGuard, Shadowsocks 2022,
    WebSocket / gRPC transports and Mux. Nodes of these types are skipped and
    the rest of your profile still loads.

