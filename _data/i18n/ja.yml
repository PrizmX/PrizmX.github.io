features:
  eyebrow: 機能
  heading: 必要なものは、<wbr>すべてワンクリックで
  intro: >-
    PrizmX は普段はメニューバーに常駐し、ポリシーやルール、トラフィックを詳しく調べたいときはフル機能のコンソールを開けます。
  items:
    - icon: menubar
      title: メニューバー中心
      text: >-
        接続、Rule / Global / Direct の切り替え、システムプロキシのオン／オフ、ノードの選択、リアルタイムの速度確認まで、ウインドウを開かずに行えます。
    - icon: profile
      title: Clash と sing-box のプロファイル
      text: >-
        Clash YAML または sing-box JSON をファイルやサブスクリプション URL から読み込み、アプリ内でサブスクリプションを常に最新の状態に保てます。
    - icon: tunnel
      title: TUN とシステムプロキシ
      text: >-
        Packet Tunnel システム拡張内の FakeIP TUN ですべてのアプリの通信を取り込むか、HTTP + SOCKS5 の混合ポートでシステムプロキシを使えます。Allow LAN を使えば、ほかのデバイスとも共有できます。
    - icon: route
      title: ルールベースのルーティング
      text: >-
        ルールが各接続をポリシーへ振り分けます。ポリシーグループ（select、url-test、fallback、load-balance）がノードを選び、遅延を抑えます。
    - icon: inspect
      title: Inspector
      text: >-
        最近の接続と現在アクティブな接続を、接続を開始したアプリ、マッチしたポリシー、プロトコル、接続時間、送受信それぞれのバイト数とともに閲覧できます。
    - icon: chart
      title: トラフィックと遅延
      text: >-
        日別・月別の合計と使用量の上位を表示します。経路の遅延はインターネット・DNS・プロキシに分けて示すので、どこで遅くなっているのかを見分けられます。

native:
  eyebrow: 内部の仕組み
  heading: パケットレベルまで<wbr>ネイティブで構築
  intro: >-
    Electron のシェルも、組み込みのサードパーティ製コアもありません。プロトコル、ルール、エンジン、TCP/IP スタックはすべて Swift で書かれ、Apple の各プラットフォームで共有されています。
  points:
    - title: 隅々まで Swift 6
      text: >-
        UI には SwiftUI を、その下では厳格な並行性チェックを採用しています。ひとつのコードベースが、現在は Mac アプリを、次は iOS アプリを支えます。
    - title: SwiftTCP ユーザー空間スタック
      text: >-
        Network Extension 向けに専用設計された TCP/IP スタックで、ゼロコピーのパケット経路、CUBIC または BBR による輻輳制御、フローごとのロックフリーなイベントループを備えています。
    - title: サンドボックス化・公証済み
      text: >-
        サンドボックス化されたホストアプリと Packet Tunnel システム拡張で構成され、署名と Apple の公証を受けた DMG として CI から直接配布されます。
    - title: オープンコア、Apache 2.0
      text: >-
        アプリ、プロトコルエンジン、ネットワークスタックは GitHub で公開されています。コードを読んだり、自分でビルドしたり、開発に参加したりできます。
  repos_label: ソースリポジトリ

protocols:
  eyebrow: プロトコル
  heading: お使いのサーバーで<wbr>そのまま使える
  intro: >-
    Clash YAML と sing-box JSON のどちらからでも、以下のアウトバウンドを読み込めます。VLESS はフレーミング、TLS と REALITY はトランスポート、Vision は VLESS のフローで、これらは自由に組み合わせられます。
  caption: 対応アウトバウンドプロトコル
  columns:
    protocol: プロトコル
    details: トランスポートとオプション
    tcp: TCP
    udp: UDP
  supported: 対応
  unsupported: 非対応
  rows:
    - name: Shadowsocks
      details: "AEAD 暗号（`aes-128-gcm`、`aes-256-gcm`）、TCP と UDP にネイティブ対応"
      tcp: true
      udp: true
    - name: VLESS
      details: "TCP、TLS または REALITY · `xtls-rprx-vision` フロー · UDP over stream"
      tcp: true
      udp: true
    - name: Trojan
      details: SNI 対応の TLS
      tcp: true
      udp: false
    - name: AnyTLS
      details: SNI とアイドルセッションプールに対応した TLS 1.3
      tcp: true
      udp: false
    - name: Direct
      details: マッチしたトラフィックはプロキシを経由しません
      tcp: true
      udp: true
  not_yet: >-
    現時点で未対応：VMess、Hysteria、TUIC、WireGuard、Shadowsocks 2022、WebSocket / gRPC トランスポート、Mux。これらのタイプのノードはスキップされ、プロファイルの残りの部分はそのまま読み込まれます。

