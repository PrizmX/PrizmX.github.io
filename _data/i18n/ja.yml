faq:
  eyebrow: FAQ
  heading: よくある質問
  items:
    - q: PrizmX は無料ですか？
      a: >-
        はい。Mac 向けの PrizmX コミュニティ版は無料のオープンソースソフトウェアで、[Apache License 2.0](https://github.com/PrizmX/PrizmX/blob/main/LICENSE) のもとで公開されています。
    - q: 動作に必要な環境は？
      a: >-
        macOS %min% 以降が動作する Mac が必要です。署名・公証済みの DMG を [GitHub Releases](https://github.com/PrizmX/PrizmX/releases/latest) からダウンロードし、PrizmX を「アプリケーション」フォルダにドラッグしてください。
    - q: トンネルを有効にするには？
      a: >-
        初めて TUN をオンにすると、macOS から PrizmX Tunnel システム拡張の許可を求められます。**システム設定 → 一般 → ログイン項目と機能拡張 → ネットワーク機能拡張**を開き、**PrizmX Tunnel** をオンにしてください。
    - q: 今使っている Clash のサブスクリプションをそのまま使えますか？
      a: >-
        はい。PrizmX はローカルファイルまたはサブスクリプション URL から Clash YAML と sing-box JSON を読み込めます。未対応のプロトコルのノードはスキップされ、ルール、ポリシーグループ、残りのノードは通常どおり読み込まれます。
    - q: TUN とシステムプロキシの違いは？
      a: >-
        システムプロキシは、HTTP CONNECT と SOCKS5 の両方に対応した混合ポート（デフォルトは 7890）を通じて、macOS のプロキシ設定に従うアプリに対応します。TUN は、プロキシ設定を無視するアプリも含めたすべてのトラフィックを、FakeIP DNS を使った Packet Tunnel 経由でルーティングします。どちらか一方だけでも、両方同時にも使えます。
    - q: PrizmX は VMess、Hysteria、WireGuard に対応していますか？
      a: >-
        まだ対応していません。現在 PrizmX が対応しているのは Shadowsocks、VLESS（TLS、REALITY、Vision）、Trojan、AnyTLS です。進捗は [PrizmX-Foundation](https://github.com/PrizmX/PrizmX-Foundation) で確認できます。
    - q: PrizmX は HTTPS 通信を復号しますか？
      a: >-
        いいえ。コミュニティ版は接続のメタデータ（アプリ、ホスト、ポリシー、プロトコル、バイト数）を表示しますが、トラフィックを復号したり書き換えたりすることは一切ありません。HTTP のキャプチャ、復号、書き換えは App Store 版で提供予定です。
    - q: iPhone 版はありますか？
      a: >-
        App Store 版の一部として開発中で、Mac アプリと同じコアを共有しています。最新情報は [GitHub の PrizmX Organization](https://github.com/PrizmX) でご確認ください。

