faq:
  eyebrow: FAQ
  heading: Häufig gestellte Fragen
  items:
    - q: Ist PrizmX kostenlos?
      a: >-
        Ja. PrizmX Community für Mac ist kostenlos und Open Source unter der
        [Apache License 2.0](https://github.com/PrizmX/PrizmX/blob/main/LICENSE).
    - q: Was wird zum Ausführen benötigt?
      a: >-
        Ein Mac mit macOS %min% oder neuer. Das signierte und notarisierte DMG
        von [GitHub Releases](https://github.com/PrizmX/PrizmX/releases/latest)
        laden und PrizmX in den Ordner „Programme“ ziehen.
    - q: Wie lässt sich der Tunnel aktivieren?
      a: >-
        Beim ersten Einschalten von TUN fragt macOS, ob die Systemerweiterung
        PrizmX Tunnel erlaubt werden soll. Dazu
        **Systemeinstellungen → Allgemein → Anmeldeobjekte & Erweiterungen → Netzwerkerweiterungen**
        öffnen und **PrizmX Tunnel** einschalten.
    - q: Lässt sich ein bestehendes Clash-Abo verwenden?
      a: >-
        Ja. PrizmX liest Clash YAML und sing-box JSON aus einer lokalen Datei
        oder über eine Abo-URL. Knoten mit nicht unterstützten Protokollen
        werden übersprungen; Regeln, Richtliniengruppen und die übrigen Knoten
        werden wie gewohnt geladen.
    - q: Was ist der Unterschied zwischen TUN und Systemproxy?
      a: >-
        Der Systemproxy bedient Apps, die die Proxy-Einstellungen von macOS
        beachten, über einen gemischten Port (standardmäßig 7890), der HTTP
        CONNECT und SOCKS5 spricht. TUN leitet den gesamten Traffic – auch von
        Apps, die Proxy-Einstellungen ignorieren – durch einen Packet Tunnel
        mit FakeIP-DNS. Beides lässt sich einzeln oder gemeinsam nutzen.
    - q: Unterstützt PrizmX VMess, Hysteria oder WireGuard?
      a: >-
        Noch nicht. Aktuell unterstützt PrizmX Shadowsocks, VLESS (TLS,
        REALITY, Vision), Trojan und AnyTLS. Den Fortschritt verfolgen unter
        [PrizmX-Foundation](https://github.com/PrizmX/PrizmX-Foundation).
    - q: Entschlüsselt PrizmX HTTPS-Traffic?
      a: >-
        Nein. Die Community Edition zeigt Verbindungsmetadaten – App, Host,
        Richtlinie, Protokoll und Bytes –, entschlüsselt oder verändert den
        Traffic aber nie. HTTP-Mitschnitt, Entschlüsselung und Umschreiben sind
        für die App Store Edition geplant.
    - q: Gibt es eine iPhone-Version?
      a: >-
        Sie ist als Teil der App Store Edition in Entwicklung und nutzt
        denselben Kern wie die Mac-App. Neuigkeiten gibt es bei der
        [PrizmX-Organisation auf GitHub](https://github.com/PrizmX).

