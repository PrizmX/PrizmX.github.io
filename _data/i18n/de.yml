features:
  eyebrow: Funktionen
  heading: Alles Nötige, nur einen Klick entfernt
  intro: >-
    Im Alltag arbeitet PrizmX in der Menüleiste. Für einen tieferen Blick in
    Richtlinien, Regeln und Traffic öffnet sich eine vollständige Konsole.
  items:
    - icon: menubar
      title: Menüleiste im Mittelpunkt
      text: >-
        Verbinden, zwischen Rule, Global und Direct wechseln, den Systemproxy
        ein- und ausschalten, einen Knoten wählen und die Live-Geschwindigkeit
        verfolgen – ohne ein Fenster zu öffnen.
    - icon: profile
      title: Clash- & sing-box-Profile
      text: >-
        Clash YAML oder sing-box JSON aus einer Datei oder über eine Abo-URL
        importieren und Abos direkt in der App aktuell halten.
    - icon: tunnel
      title: TUN und Systemproxy
      text: >-
        Jede App per FakeIP-TUN in einer Packet-Tunnel-Systemerweiterung
        erfassen oder den Systemproxy auf einem gemischten HTTP- + SOCKS5-Port
        nutzen. Mit Allow LAN lässt er sich mit anderen Geräten teilen.
    - icon: route
      title: Regelbasiertes Routing
      text: >-
        Regeln weisen jede Verbindung einer Richtlinie zu. Richtliniengruppen –
        select, url-test, fallback und load-balance – wählen den Knoten und
        halten die Latenz im Griff.
    - icon: inspect
      title: Inspector
      text: >-
        Letzte und aktive Verbindungen durchsehen – mit der App, die sie
        aufgebaut hat, der zutreffenden Richtlinie, Protokoll, Dauer und Bytes
        in jede Richtung.
    - icon: chart
      title: Traffic & Latenz
      text: >-
        Tages- und Monatssummen, die größten Verbraucher und eine Pfadlatenz,
        aufgeteilt in Internet, DNS und Proxy – so lässt sich erkennen, wo
        Verzögerungen entstehen.

native:
  eyebrow: Unter der Haube
  heading: Nativ entwickelt – bis auf Paketebene
  intro: >-
    Keine Electron-Hülle und kein eingebetteter Kern von Drittanbietern.
    Protokolle, Regeln, Engine und TCP/IP-Stack sind in Swift geschrieben und
    werden über Apple-Plattformen hinweg gemeinsam genutzt.
  points:
    - title: Swift 6 durch und durch
      text: >-
        SwiftUI an der Oberfläche, strikte Concurrency darunter. Eine Codebasis
        treibt heute die Mac-App an und als Nächstes die iOS-App.
    - title: SwiftTCP-Userspace-Stack
      text: >-
        Ein eigens für Network Extension entwickelter TCP/IP-Stack mit
        Zero-Copy-Paketpfad, CUBIC- oder BBR-Überlastkontrolle und lockfreien
        Event-Loops pro Flow.
    - title: Sandbox und Notarisierung
      text: >-
        Eine Host-App in der Sandbox plus eine Packet-Tunnel-Systemerweiterung,
        ausgeliefert als signiertes und von Apple notarisiertes DMG direkt aus
        der CI.
    - title: Open Core, Apache 2.0
      text: >-
        App, Protokoll-Engine und Netzwerk-Stack sind öffentlich auf GitHub.
        Lesen, selbst bauen oder mitwirken.
  repos_label: Quellcode-Repositorys

protocols:
  eyebrow: Protokolle
  heading: Funktioniert mit den Servern, die schon im Einsatz sind
  intro: >-
    Clash YAML und sing-box JSON importieren beide die folgenden Outbounds.
    VLESS ist das Framing, TLS und REALITY sind Transporte, Vision ist ein
    VLESS-Flow – frei miteinander kombinierbar.
  caption: Unterstützte Outbound-Protokolle
  columns:
    protocol: Protokoll
    details: Transporte & Optionen
    tcp: TCP
    udp: UDP
  supported: "Ja"
  unsupported: "Nein"
  rows:
    - name: Shadowsocks
      details: "AEAD-Chiffren `aes-128-gcm` und `aes-256-gcm`, natives TCP und UDP"
      tcp: true
      udp: true
    - name: VLESS
      details: "TCP, TLS oder REALITY · `xtls-rprx-vision`-Flow · UDP über den Stream"
      tcp: true
      udp: true
    - name: Trojan
      details: TLS mit SNI
      tcp: true
      udp: false
    - name: AnyTLS
      details: TLS 1.3 mit SNI und einem Pool inaktiver Sitzungen
      tcp: true
      udp: false
    - name: Direct
      details: Proxy für passenden Traffic umgehen
      tcp: true
      udp: true
  not_yet: >-
    Noch nicht unterstützt: VMess, Hysteria, TUIC, WireGuard, Shadowsocks 2022,
    WebSocket- / gRPC-Transporte und Mux. Knoten dieser Typen werden
    übersprungen, der Rest des Profils wird trotzdem geladen.

