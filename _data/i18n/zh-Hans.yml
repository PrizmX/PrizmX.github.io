features:
  eyebrow: 功能
  heading: 常用操作，一键可达
  intro: >-
    日常使用只需菜单栏；需要细调策略、规则和流量时，再打开完整的控制台。
  items:
    - icon: menubar
      title: 菜单栏优先
      text: >-
        连接、在 Rule / Global / Direct 之间切换、开关系统代理、选择节点、查看实时速率，都无需打开窗口。
    - icon: profile
      title: 兼容 Clash 与 sing-box
      text: >-
        从本地文件或订阅链接导入 Clash YAML 或 sing-box JSON，并可在应用内直接更新订阅。
    - icon: tunnel
      title: TUN 与系统代理
      text: >-
        通过 Packet Tunnel 系统扩展中的 FakeIP TUN 接管所有应用，或使用 HTTP + SOCKS5 混合端口的系统代理；开启 Allow LAN 即可共享给局域网设备。
    - icon: route
      title: 规则分流
      text: >-
        规则把每条连接交给对应策略；select、url-test、fallback、load-balance 策略组负责选择节点、控制延迟。
    - icon: inspect
      title: Inspector
      text: >-
        浏览最近与活动中的连接：发起连接的 App、命中的策略、协议、时长以及上下行流量。
    - icon: chart
      title: 流量与延迟
      text: >-
        按日、按月统计流量与消耗排行；路径延迟拆分为互联网、DNS 和代理三段，快速定位慢在哪里。

native:
  eyebrow: 技术底座
  heading: 从界面到数据包，全部原生
  intro: >-
    没有 Electron 外壳，也不内嵌第三方内核。协议、规则、引擎和 TCP/IP 协议栈均以 Swift 编写，并在 Apple 各平台间共享。
  points:
    - title: 全程 Swift 6
      text: >-
        界面使用 SwiftUI，底层启用严格并发检查。同一套代码今天驱动 Mac 版，接下来驱动 iOS 版。
    - title: SwiftTCP 用户态协议栈
      text: >-
        专为 Network Extension 打造的 TCP/IP 协议栈：零拷贝数据路径、CUBIC / BBR 拥塞控制、按连接划分的无锁事件循环。
    - title: 沙盒运行，经过公证
      text: >-
        沙盒化的主应用加 Packet Tunnel 系统扩展，由 CI 直接产出经签名和 Apple 公证的 DMG。
    - title: Open Core，Apache 2.0
      text: >-
        应用、协议引擎和网络协议栈都在 GitHub 公开。可以阅读、自行构建，也欢迎贡献。
  repos_label: 源码仓库

protocols:
  eyebrow: 协议
  heading: 直接使用<wbr>你现有的服务器
  intro: >-
    Clash YAML 与 sing-box JSON 均可导入以下出站协议。VLESS 是协议封装，TLS 与 REALITY 是传输层，Vision 是 VLESS 的 flow，三者可自由组合。
  caption: 支持的出站协议
  columns:
    protocol: 协议
    details: 传输与选项
    tcp: TCP
    udp: UDP
  supported: 支持
  unsupported: 不支持
  rows:
    - name: Shadowsocks
      details: "AEAD 加密 `aes-128-gcm`、`aes-256-gcm`，原生 TCP 与 UDP"
      tcp: true
      udp: true
    - name: VLESS
      details: "TCP、TLS 或 REALITY · `xtls-rprx-vision` flow · UDP over stream"
      tcp: true
      udp: true
    - name: Trojan
      details: TLS，支持 SNI
      tcp: true
      udp: false
    - name: AnyTLS
      details: TLS 1.3，支持 SNI 与空闲会话池
      tcp: true
      udp: false
    - name: Direct
      details: 命中的流量直接连接，不经过代理
      tcp: true
      udp: true
  not_yet: >-
    暂不支持：VMess、Hysteria、TUIC、WireGuard、Shadowsocks 2022、WebSocket / gRPC 传输以及 Mux。这些类型的节点会被跳过，配置中的其余部分照常加载。

