faq:
  eyebrow: 常见问题
  heading: 常见问题
  items:
    - q: PrizmX 免费吗？
      a: >-
        是的。PrizmX Mac 社区版免费且开源，采用 [Apache License 2.0](https://github.com/PrizmX/PrizmX/blob/main/LICENSE) 许可。
    - q: 运行需要什么条件？
      a: >-
        一台运行 macOS %min% 或更高版本的 Mac。从 [GitHub Releases](https://github.com/PrizmX/PrizmX/releases/latest) 下载经签名和公证的 DMG，把 PrizmX 拖进“应用程序”即可。
    - q: 如何启用隧道？
      a: >-
        首次开启 TUN 时，macOS 会请求允许 PrizmX Tunnel 系统扩展。打开**系统设置 → 通用 → 登录项与扩展 → 网络扩展**，启用 **PrizmX Tunnel**。
    - q: 可以使用现有的 Clash 订阅吗？
      a: >-
        可以。PrizmX 支持从本地文件或订阅链接读取 Clash YAML 和 sing-box JSON。使用暂不支持协议的节点会被跳过，规则、策略组和其余节点照常加载。
    - q: TUN 和系统代理有什么区别？
      a: >-
        系统代理通过混合端口（默认 7890，支持 HTTP CONNECT 与 SOCKS5）服务遵循 macOS 代理设置的应用；TUN 借助 Packet Tunnel 和 FakeIP DNS 接管全部流量，包括不遵循代理设置的应用。两者可单独或同时开启。
    - q: 支持 VMess、Hysteria 或 WireGuard 吗？
      a: >-
        暂不支持。目前支持 Shadowsocks、VLESS（TLS、REALITY、Vision）、Trojan 和 AnyTLS。进展可关注 [PrizmX-Foundation](https://github.com/PrizmX/PrizmX-Foundation)。
    - q: PrizmX 会解密 HTTPS 流量吗？
      a: >-
        不会。社区版只展示连接元数据——App、主机、策略、协议和流量——不会解密或改写流量。HTTP 抓包、解密与重写计划在 App Store 版提供。
    - q: 有 iPhone 版吗？
      a: >-
        iPhone 版作为 App Store 版本的一部分正在开发中，与 Mac 版共用同一套核心。可关注 [GitHub 上的 PrizmX 组织](https://github.com/PrizmX)获取最新进展。

