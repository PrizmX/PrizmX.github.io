{%- assign logo_id = include.id | default: "logo-fill" -%}
<svg class="logo" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="{{ logo_id }}" x1="32%" y1="0%" x2="72%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="42%" stop-color="#5341F5"/>
      <stop offset="100%" stop-color="#1C1358"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.2" fill="url(#{{ logo_id }})"/>
  <g fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" transform="translate(16 16) scale(.92) translate(-12 -12.49)">
    <path d="M9.8 5.245 L14.2 5.245 L19.8 14.944 L17.6 18.755 L6.4 18.755 L4.2 14.944 Z"/>
    <path d="M12 6.515 L17.6 16.215 L6.4 16.215 Z"/>
  </g>
</svg>
